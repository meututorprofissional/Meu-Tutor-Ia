name: Gemini - teste manual controlado
on:
  workflow_dispatch:
    inputs:
      modo:
        description: 'dry_run sem rede; diagnostico lista; detalhe consulta modelo; live v1beta; live_v1 v1'
        type: choice
        options: [dry_run, diagnostico, detalhe, live, live_v1]
        default: dry_run
        required: true
      confirmar_gratuito:
        description: 'Para consultas e live digite CONFIRMO_GRATUITO; sem faturamento'
        type: string
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: gemini-teste-manual
  cancel-in-progress: false
jobs:
  conectividade:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verificar modo e realizar no maximo uma chamada
        env:
          MODO: ${{ inputs.modo }}
          CONFIRMACAO: ${{ inputs.confirmar_gratuito }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          import json, os, urllib.request, urllib.error
          mode = os.environ.get("MODO")
          if mode == "dry_run":
              print("DRY RUN: nenhuma chamada feita.")
              raise SystemExit(0)
          if mode not in ("live", "live_v1", "diagnostico", "detalhe") or os.environ.get("CONFIRMACAO") != "CONFIRMO_GRATUITO":
              raise SystemExit("Bloqueado: modo ou confirmacao invalida.")
          key = os.environ.get("GEMINI_API_KEY")
          if not key:
              raise SystemExit("Bloqueado: segredo ausente.")
          if mode == "diagnostico":
              url = "https://generativelanguage.googleapis.com/v1beta/models?pageSize=100"
              request = urllib.request.Request(url, headers={"x-goog-api-key": key})
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      raw = response.read(200001)
              except urllib.error.HTTPError as error:
                  print("Falha HTTP ao listar modelos:", error.code)
                  raise SystemExit(1)
              except urllib.error.URLError:
                  raise SystemExit("Falha de rede ao listar modelos.")
              if len(raw) > 200000:
                  raise SystemExit("Lista de modelos grande demais.")
              try:
                  result = json.loads(raw)
                  models = result.get("models", [])
                  supported = sorted(set(
                      m.get("name", "") for m in models
                      if "generateContent" in m.get("supportedGenerationMethods", [])
                      and m.get("name", "").startswith("models/gemini-")
                  ))
              except (ValueError, TypeError, AttributeError):
                  raise SystemExit("Formato inesperado da lista de modelos.")
              print("Modelos disponiveis com generateContent (nomes publicos):")
              for name in supported[:40]:
                  print(name)
              print("Modelos encontrados:", len(supported))
              print("Observacao: disponibilidade nao garante cota gratuita; conferir precos antes de usar.")
              raise SystemExit(0 if supported else 1)
          if mode == "detalhe":
              # GET de metadados publicos; nao gera texto nem imprime resposta bruta.
              for api_version in ("v1beta", "v1"):
                  url = ("https://generativelanguage.googleapis.com/"
                         + api_version + "/models/gemini-2.5-flash-lite")
                  request = urllib.request.Request(url, headers={"x-goog-api-key": key})
                  try:
                      with urllib.request.urlopen(request, timeout=20) as response:
                          raw = response.read(50001)
                  except urllib.error.HTTPError as error:
                      print("GET modelo", api_version, "HTTP", error.code)
                      continue
                  except urllib.error.URLError:
                      print("GET modelo", api_version, "falha de rede")
                      continue
                  if len(raw) > 50000:
                      print("GET modelo", api_version, "resposta excessiva")
                      continue
                  try:
                      metadata = json.loads(raw)
                      methods = metadata.get("supportedGenerationMethods", [])
                      model_name = metadata.get("name", "")
                      valid_name = model_name == "models/gemini-2.5-flash-lite"
                      print("GET modelo", api_version, "HTTP 200",
                            "nome esperado:", valid_name,
                            "suporta generateContent:", "generateContent" in methods)
                  except (ValueError, TypeError, AttributeError):
                      print("GET modelo", api_version, "formato inesperado")
              print("Consulta de metadados finalizada. Nenhuma geracao realizada.")
              raise SystemExit(0)
          # Escolha explicita: nenhum fallback automatico nem segunda geracao.
          api_version = "v1" if mode == "live_v1" else "v1beta"
          url = ("https://generativelanguage.googleapis.com/" + api_version
                 + "/models/gemini-2.5-flash-lite:generateContent")
          body = json.dumps({"contents":[{"parts":[{"text":"Responda somente OK."}]}],
                             "generationConfig":{"temperature":0,"maxOutputTokens":16}}).encode()
          request = urllib.request.Request(url, data=body, method="POST",
                    headers={"Content-Type":"application/json","x-goog-api-key":key})
          print("Versao da API para geracao:", api_version)
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  data = response.read(20001)
          except urllib.error.HTTPError as error:
              # Nunca imprimir corpo bruto, mensagem da API ou credenciais.
              # Somente status e motivos de um conjunto publico e fixo.
              allowed_status = {
                  "NOT_FOUND", "INVALID_ARGUMENT", "PERMISSION_DENIED",
                  "UNAUTHENTICATED", "RESOURCE_EXHAUSTED", "FAILED_PRECONDITION",
                  "UNAVAILABLE", "INTERNAL", "DEADLINE_EXCEEDED"
              }
              allowed_reasons = {
                  "API_KEY_INVALID", "API_KEY_SERVICE_BLOCKED",
                  "API_KEY_HTTP_REFERRER_BLOCKED", "API_KEY_IP_ADDRESS_BLOCKED",
                  "SERVICE_DISABLED", "ACCESS_TOKEN_SCOPE_INSUFFICIENT",
                  "RATE_LIMIT_EXCEEDED", "QUOTA_EXCEEDED",
                  "CONSUMER_INVALID", "BILLING_DISABLED", "MODEL_NOT_FOUND"
              }
              status = "NAO_IDENTIFICADO"
              reasons = set()
              message_category = "NAO_RECONHECIDA"
              try:
                  raw = error.read(8192)
                  parsed = json.loads(raw)
                  details = parsed.get("error", {})
                  if isinstance(details, dict):
                      candidate = details.get("status")
                      if isinstance(candidate, str) and candidate in allowed_status:
                          status = candidate
                      # Nao registrar error.message. Categorias fixas, sem ecoar
                      # qualquer trecho do conteudo retornado pela API.
                      message = details.get("message")
                      if isinstance(message, str):
                          normalized = message.lower()[:4096]
                          if "not supported for generatecontent" in normalized or "not supported for this api version" in normalized:
                              message_category = "MODELO_METODO_OU_VERSAO_INCOMPATIVEL"
                          elif "model" in normalized and "not found" in normalized:
                              message_category = "MODELO_NAO_ENCONTRADO"
                          elif "permission" in normalized or "not authorized" in normalized or "access denied" in normalized:
                              message_category = "PERMISSAO_OU_ACESSO"
                          elif "quota" in normalized or "rate limit" in normalized:
                              message_category = "COTA_OU_LIMITE"
                          elif "billing" in normalized:
                              message_category = "FATURAMENTO_MENCIONADO"
                      for item in details.get("details", [])[:10]:
                          if isinstance(item, dict):
                              candidate = item.get("reason")
                              if isinstance(candidate, str) and candidate in allowed_reasons:
                                  reasons.add(candidate)
              except (ValueError, TypeError, AttributeError, OSError):
                  pass
              print("Falha HTTP:", error.code, "status:", status,
                    "motivos permitidos:", ",".join(sorted(reasons)) or "nenhum")
              print("Categoria segura da mensagem:", message_category)
              print("Nenhum corpo bruto ou mensagem original da API foi registrado.")
              raise SystemExit(1)
          except urllib.error.URLError:
              raise SystemExit("Falha de rede.")
          if len(data)>20000:
              raise SystemExit("Resposta muito grande.")
          try:
              candidates=json.loads(data).get("candidates",[])
              parts=candidates[0].get("content",{}).get("parts",[])
              ok=any(isinstance(p.get("text"),str) and p["text"].strip() for p in parts)
          except (ValueError,IndexError,TypeError,AttributeError):
              ok=False
          print("Uma chamada realizada; texto recebido:",ok)
          if not ok:
              raise SystemExit(1)
          PY
