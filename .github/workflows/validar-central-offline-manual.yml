name: Validar central Issue 10 (testes e leitura publica)
on:
  push:
    branches:
      - desenvolvimento-responsivo
    paths:
      - 'scripts/preparar-pacote-revisao.py'
      - 'scripts/comparar-pareceres.py'
      - 'scripts/coordenador-tres-ias.py'
      - 'scripts/preparar-gemini-gratis.py'
      - 'tests/test_preparar_gemini_gratis.py'
      - 'tests/test_coordenador_tres_ias.py'
      - 'tests/test_comparar_pareceres.py'
      - 'scripts/central-mensagens-offline.py'
      - 'scripts/coletar-issue10-publica.py'
      - 'tests/test_central_mensagens.py'
      - 'tests/test_coletar_issue10.py'
      - 'tests/test_integracao_issue10.py'
      - '.github/workflows/validar-central-offline-manual.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes-offline:
    if: github.ref == 'refs/heads/desenvolvimento-responsivo'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout da branch de testes
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validar sintaxe dos arquivos
        run: |
          python -m py_compile scripts/central-mensagens-offline.py scripts/coletar-issue10-publica.py tests/test_central_mensagens.py tests/test_coletar_issue10.py tests/test_integracao_issue10.py
      - name: Executar 16 testes offline
        run: |
          python -m unittest discover -s tests -p 'test_*issue10.py' -v
          python -m unittest discover -s tests -p 'test_central_mensagens.py' -v
      - name: Validar coleta real publica da Issue 10
        run: |
          mkdir -p /tmp/central-issue10
          python scripts/coletar-issue10-publica.py --output /tmp/central-issue10/comentarios.json
          python scripts/central-mensagens-offline.py /tmp/central-issue10/comentarios.json --output /tmp/central-issue10/relatorio.md
          python - <<'PY'
          import json
          from pathlib import Path
          base = Path("/tmp/central-issue10")
          data = json.loads((base / "comentarios.json").read_text(encoding="utf-8"))
          report = (base / "relatorio.md").read_text(encoding="utf-8")
          comments = data["comments"]
          expected = {7085980047, 7086077278, 7086085183, 7086127779,
                      7086163745, 7086198092, 7086213934}
          ids = {c["id"] for c in comments}
          assert expected <= ids, "Comentarios originais da Issue 10 ausentes"
          assert report.count("## Comentario ") == len(comments), "Relatorio incompleto"
          assert report.count("Indicacao textual de encaminhamento: sim") >= 2
          print(f"Coleta real aprovada: {len(comments)} comentarios; relatorio completo.")
          PY
      - name: Validar pacote real de revisao em ambiente isolado
        env:
          GITHUB_ACTIONS: "true"
          GITHUB_REF_NAME: desenvolvimento-responsivo
        run: |
          python - <<'PY'
          import json
          import subprocess
          import tempfile
          from pathlib import Path
          sha = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          base = subprocess.check_output(["git", "rev-parse", "HEAD^"], text=True).strip()
          with tempfile.TemporaryDirectory() as tmp:
              out = Path(tmp) / "pacote.json"
              subprocess.run(["python", "scripts/preparar-pacote-revisao.py",
                              "--sha", sha, "--base", base,
                              "--missao", "Revisar mudancas da branch de testes",
                              "--output", str(out)], check=True)
              data = json.loads(out.read_text(encoding="utf-8"))
              assert data["commit_sha"] == sha
              assert data["base_sha"] == base
              assert data["agentes_destino"] == ["ChatGPT", "Gemini/Antigravity", "Claude"]
              assert data["arquivos"] and data["diff_nao_confiavel"]
              print("Pacote real gerado e validado localmente, sem publicacao.")
          PY
      - name: Validar comparacao supervisionada dos tres pareceres
        run: |
          python -m py_compile scripts/comparar-pareceres.py tests/test_comparar_pareceres.py
          python -m unittest discover -s tests -p 'test_comparar_pareceres.py' -v
      - name: Validar coordenador gratuito offline
        run: |
          python -m py_compile scripts/coordenador-tres-ias.py tests/test_coordenador_tres_ias.py
          python -m unittest discover -s tests -p 'test_coordenador_tres_ias.py' -v
      - name: Validar preparacao gratuita Gemini sem rede
        run: |
          python -m py_compile scripts/preparar-gemini-gratis.py tests/test_preparar_gemini_gratis.py
          python -m unittest discover -s tests -p 'test_preparar_gemini_gratis.py' -v
