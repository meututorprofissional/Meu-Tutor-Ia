name: Validar central Issue 10 (testes e leitura publica)
on:
  push:
    branches:
      - desenvolvimento-responsivo
    paths:
      - 'scripts/central-mensagens-offline.py'
      - 'scripts/coletar-issue10-publica.py'
      - 'tests/test_central_mensagens.py'
      - 'tests/test_coletar_issue10.py'
      - 'tests/test_integracao_issue10.py'
      - '.github/workflows/validar-central-offline-manual.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes-offline:
    if: github.ref == 'refs/heads/desenvolvimento-responsivo'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout da branch de testes
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validar sintaxe dos arquivos
        run: |
          python -m py_compile scripts/central-mensagens-offline.py scripts/coletar-issue10-publica.py tests/test_central_mensagens.py tests/test_coletar_issue10.py tests/test_integracao_issue10.py
      - name: Executar 16 testes offline
        run: |
          python -m unittest discover -s tests -p 'test_*issue10.py' -v
          python -m unittest discover -s tests -p 'test_central_mensagens.py' -v
      - name: Validar coleta real publica da Issue 10
        run: |
          mkdir -p /tmp/central-issue10
          python scripts/coletar-issue10-publica.py --output /tmp/central-issue10/comentarios.json
          python scripts/central-mensagens-offline.py /tmp/central-issue10/comentarios.json --output /tmp/central-issue10/relatorio.md
          python - <<'PY'
          import json
          from pathlib import Path
          base = Path("/tmp/central-issue10")
          data = json.loads((base / "comentarios.json").read_text(encoding="utf-8"))
          report = (base / "relatorio.md").read_text(encoding="utf-8")
          comments = data["comments"]
          expected = {7085980047, 7086077278, 7086085183, 7086127779,
                      7086163745, 7086198092, 7086213934}
          ids = {c["id"] for c in comments}
          assert expected <= ids, "Comentarios originais da Issue 10 ausentes"
          assert report.count("## Comentario ") == len(comments), "Relatorio incompleto"
          assert report.count("Indicacao textual de encaminhamento: sim") >= 2
          print(f"Coleta real aprovada: {len(comments)} comentarios; relatorio completo.")
          PY
